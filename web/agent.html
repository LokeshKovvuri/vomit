<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>vomit — agent</title>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#131318; --line:#23232c;
    --fg:#e9e9ef; --mut:#8b8b96;
    --accent:#7c5cff; --accent2:#00d4aa; --danger:#ff5566;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;padding:28px}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.5px;
        background:linear-gradient(90deg,var(--accent),var(--accent2));
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--mut);font-size:12px;border:1px solid var(--line);
       padding:3px 8px;border-radius:20px}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  .panel{background:var(--bg2);border:1px solid var(--line);
         border-radius:var(--radius);padding:20px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .row+.row{margin-top:12px}
  .sid{
    font-family:ui-monospace,Menlo,monospace;font-size:14px;
    background:#0f0f14;border:1px solid var(--line);
    padding:8px 12px;border-radius:8px;color:var(--accent2);
    user-select:all;
  }
  button{
    font:inherit;cursor:pointer;border:1px solid var(--line);
    background:#18181f;color:var(--fg);
    padding:10px 16px;border-radius:10px;transition:.15s;
  }
  button:hover{background:#1f1f2a;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:linear-gradient(135deg,var(--accent),#5a3fd6);
                 border-color:transparent;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--mut);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);
       transition:.2s}
  .dot.live{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .dot.wait{background:#ffb020;box-shadow:0 0 10px #ffb020}
  .dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
  video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;
        border:1px solid var(--line);display:block;margin-top:14px}
  .label{color:var(--mut);font-size:12px;text-transform:uppercase;
         letter-spacing:.5px;margin-bottom:8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
         background:#18181f;border:1px solid var(--accent);
         padding:12px 20px;border-radius:10px;font-size:13px;
         opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">vomit</div>
    <div class="tag">browser agent</div>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="label">Session</div>
      <div class="row">
        <div class="sid" id="sid">—</div>
        <button id="copy">Copy viewer link</button>
      </div>
      <div class="row">
        <button id="start" class="primary">Start sharing</button>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="status">idle</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="label">Preview</div>
      <video id="preview" autoplay muted playsinline></video>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $('status'), dotEl = $('dot'), toastEl = $('toast');

const params = new URLSearchParams(location.search);
const sessionId = params.get('session') || crypto.randomUUID().slice(0, 8);
$('sid').textContent = sessionId;
document.title = 'vomit agent — ' + sessionId;

function setStatus(text, kind) {
  statusEl.textContent = text;
  dotEl.className = 'dot' + (kind ? ' ' + kind : '');
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
fetch('/config').then(r => r.json()).then(cfg => {
  if (cfg.iceServers) iceServers = cfg.iceServers;
}).catch(() => {});

$('copy').onclick = async () => {
  const url = `${location.origin}/viewer.html?session=${sessionId}`;
  await navigator.clipboard.writeText(url);
  toast('Viewer link copied');
};

const pc = new RTCPeerConnection({ iceServers });
let ws, dataChannel, sharing = false;

pc.ondatachannel = (e) => {
  dataChannel = e.channel;
  dataChannel.onmessage = (ev) => {
    try { console.log('input', JSON.parse(ev.data)); } catch {}
  };
};

pc.onicecandidate = (e) => {
  if (e.candidate && ws?.readyState === 1) {
    ws.send(JSON.stringify({ type: 'ice', payload: e.candidate }));
  }
};

pc.onconnectionstatechange = () => {
  if (pc.connectionState === 'connected') setStatus('connected', 'live');
  if (pc.connectionState === 'failed') setStatus('connection failed', 'err');
  if (pc.connectionState === 'disconnected') setStatus('disconnected', 'err');
};

$('start').onclick = async () => {
  if (sharing) return;
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 }, audio: false
    });
    $('preview').srcObject = stream;
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    stream.getVideoTracks()[0].onended = () => location.reload();
    sharing = true;
    $('start').disabled = true;
    $('start').textContent = 'Sharing…';
    setStatus('connecting…', 'wait');

    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${wsProto}//${location.host}/ws?session=${sessionId}&role=agent`);

    ws.onopen = async () => {
      setStatus('waiting for viewer…', 'wait');
      pc.createDataChannel('input');
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', payload: offer }));
    };

    ws.onmessage = async (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'answer') {
        await pc.setRemoteDescription(msg.payload);
      } else if (msg.type === 'ice') {
        try { await pc.addIceCandidate(msg.payload); } catch {}
      }
    };

    ws.onclose = () => setStatus('signaling closed', 'err');
  } catch (err) {
    setStatus('cancelled', 'err');
    console.error(err);
  }
};
</script>
</body>
</html>
